name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [evergo]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"


concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}
  # ccache: xnu is ~2000 compiles; a patch usually changes a few of them
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_macro,pch_defines
  CCACHE_MAXSIZE: 3G
  CCACHE_WRAP: ${{ github.workspace }}/ccache-bin

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    # (Xcode 16's iig emits IORPC.kernelContent, which this xnu lacks)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64.
          # evergo: the MT6833 Cortex-A55/A76 cores are ARMv8.2 (LSE atomics,
          # PAN, 16K granule), so the kernel keeps SWEET's own
          # -march=armv8.2-a+crypto from patch 0004; unlike topaz's ARMv8.0
          # cores no -mcpu downgrade (and no LSE/PAN stripping) is needed.
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="arm64" VALID_ARCHS="arm64" OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed"/' dxb/build.sh
          grep -c 'OTHER_CFLAGS="-mkernel -nostdinc -Wno-packed"' dxb/build.sh
          # xnu's makedefs take CC/CXX from the environment dxb exports; xcodebuild
          # (mig, ctf tools) needs a single executable, so point at wrappers
          sed -i '' 's|export CC="$(xcrun -find clang)"|export CC="$CCACHE_WRAP/clang"|; s|export CXX="$(xcrun -find clang++)"|export CXX="$CCACHE_WRAP/clang++"|' dxb/build.sh
          grep -c 'export CC="$CCACHE_WRAP/clang"' dxb/build.sh
          ls dxb/patches

      - name: Install Xcode 15.4 (macos-15 experiment)
        run: |
          set -e
          brew install aria2
          aria2c -x 8 -s 8 -o xcode154.xip "https://download.developer.apple.com/Developer_Tools/Xcode_15.4/Xcode_15.4.xip" || curl -L -o xcode154.xip "https://download.developer.apple.com/Developer_Tools/Xcode_15.4/Xcode_15.4.xip"
          ls -lh xcode154.xip
          xar -xf xcode154.xip || true
          ls
          # xip needs xip tool from existing Xcode; try native
          xip --expand xcode154.xip || true
          ls -d Xcode*.app 2>/dev/null || true

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja ccache
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          # prefer an installed Xcode 15.4 if the experiment step placed it
          if [ -d "/Applications/Xcode_15.4.app" ]; then XC=/Applications/Xcode_15.4.app; else XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1); fi
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig
          mkdir -p "$CCACHE_WRAP"
          for t in clang clang++; do
            printf '#!/bin/sh\nexec ccache %s "$@"\n' "$(xcrun -find $t)" > "$CCACHE_WRAP/$t"
            chmod +x "$CCACHE_WRAP/$t"
          done
          cat "$CCACHE_WRAP/clang"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-${{ hashFiles('xnu/patches/**', '.github/workflows/xnu.yml') }}
          restore-keys: |
            ccache-${{ env.MACHINE_CONFIG }}-${{ env.KERNEL_CONFIG }}-

      # evergo 2026-11-08: dxb's KDK download (curl -L of a GitHub release URL)
      # intermittently returns an HTML error page instead of the dmg, and the
      # script hdiutil-attaches it without checking -> "image not recognized".
      # Pre-install the KDK ourselves with a size/type check and retries, so
      # build.sh sees KDKROOT already present and skips its download entirely.
      - name: Pre-install KDK (verified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          KDKROOT=/Library/Developer/KDKs/KDK_13.5_22G74.kdk
          if [ -d "$KDKROOT" ]; then echo "KDK already installed"; exit 0; fi
          URL='https://github.com/dortania/KdkSupportPkg/releases/download/22G74/Kernel_Debug_Kit_13.5_build_22G74.dmg'
          for attempt in 1 2 3; do
            echo "KDK download attempt $attempt"
            rm -f /tmp/KDK.dmg
            # evergo 2026-11-08: the releases/download URL returns 504 from
            # GitHub runners now; gh release download uses the api.github.com
            # asset endpoint, which stays reachable.
            gh release download 22G74 \
              --repo dortania/KdkSupportPkg \
              --pattern 'Kernel_Debug_Kit_13.5_build_22G74.dmg' \
              --dir /tmp --clobber \
              || { echo "gh download failed, trying curl"; \
                   curl --fail --location --max-time 900 -o /tmp/KDK.dmg "$URL" || true; }
            # --dir keeps the asset's own name; normalise to KDK.dmg
            if [ -f '/tmp/Kernel_Debug_Kit_13.5_build_22G74.dmg' ]; then
              mv -f '/tmp/Kernel_Debug_Kit_13.5_build_22G74.dmg' /tmp/KDK.dmg
            fi
            size=$(stat -f%z /tmp/KDK.dmg 2>/dev/null || echo 0)
            echo "downloaded $size bytes"
            # a real KDK dmg is 628 MB; anything smaller is an error page
            if [ "$size" -gt 100000000 ] && hdiutil imageinfo /tmp/KDK.dmg >/dev/null 2>&1; then
              break
            fi
            echo "bad dmg (size $size), retrying"
            sleep 10
          done
          test "$(stat -f%z /tmp/KDK.dmg)" -gt 100000000
          hdiutil attach /tmp/KDK.dmg
          echo "--- mounted volume ---"
          ls -la '/Volumes/Kernel Debug Kit' || true
          sudo mkdir -p /Library/Developer/KDKs
          # KDK dmgs ship a pkg installer (or a .kdk bundle); handle both.
          pkg=$(find '/Volumes/Kernel Debug Kit' -maxdepth 1 -name '*.pkg' -print -quit 2>/dev/null || true)
          if [ -n "$pkg" ]; then
            sudo installer -pkg "$pkg" -target /
          else
            sudo cp -R '/Volumes/Kernel Debug Kit/'*.kdk /Library/Developer/KDKs/ \
              || sudo cp -R '/Volumes/Kernel Debug Kit/'* /Library/Developer/KDKs/
          fi
          hdiutil detach '/Volumes/Kernel Debug Kit' || true
          ls -lah /Library/Developer/KDKs

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          ccache -z
          bash build.sh
          ccache -s

      - name: Verify evergo essentials are compiled in
        # dxb/build.sh only warns when a patch fails to apply, so a silently
        # skipped patch still yields a "successful" kernel. The patch set was
        # slimmed to 17 device-essential patches (see NOTES-evergo.md), so this
        # gate now asserts the SYMBOLS those patches must produce.
        run: |
          set -e
          K=$(ls dxb/fakeroot/System/Library/Kernels/kernel.* 2>/dev/null | head -1)
          test -n "$K" || { echo "::error::no kernel produced"; exit 1; }
          echo "kernel: $K"
          SYMS=$(nm "$K" 2>/dev/null | awk '{print $3}')
          STRS=$(strings -a "$K")
          rc=0

          need_sym() {
            if echo "$SYMS" | grep -qx "$1"; then
              echo "  ok sym: $1"
            else
              echo "::error::missing symbol '$1' (a patch was silently skipped)"
              rc=1
            fi
          }
          need_str() {
            if echo "$STRS" | grep -qF -- "$1"; then
              echo "  ok str: $1"
            else
              echo "::error::missing string '$1' (a patch was silently skipped)"
              rc=1
            fi
          }

          # device essentials
          need_sym _sweet_ufs_rootdev          # 0084e 0085e 0086e 0091e
          need_sym _sweet_early_putc           # 0081e
          need_sym _sweet_log_append           # 0083e
          need_sym _cs_invalid_page            # 0139e patches this
          # 0099e/0100e patch vm_shared_region_map_file_setup in place. That
          # symbol is LOCAL (n_type ext=0), so some nm builds omit it; report
          # instead of failing, and prove the patch differently below.
          if echo "$SYMS" | grep -qx "_vm_shared_region_map_file_setup"; then
            echo "  ok sym: _vm_shared_region_map_file_setup"
          else
            echo "  note: _vm_shared_region_map_file_setup not listed (local symbol)"
          fi
          # 0150e: the helper is often inlined, so assert its message instead
          need_str "SWEET DSI: DSI0 INTSTA reads 0xffffffff"
          # 0099e/0100e/0139e sanity: the dyld shared-region path must be present
          need_sym _cs_invalid_page
          exit $rc

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          shopt -s nullglob
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            [ -f "$lib" ] || continue
            b=$(basename "$lib" .a | tr -c 'A-Za-z0-9._-' '_')
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
