name: ios16-root image

# Build the iOS 16 root filesystem image (ios16-root.img) that the evergo shim
# kernel mounts as BSD root (rd=ufsroot0), and a trimmed RAM-loadable copy of it
# for the QEMU gate (trimmed-root.img). Runs on Linux because mkiosroot.sh needs
# apfs-fuse + hfsprogs + a FUSE mount + sudo.
#
# INPUTS  (CURRENT METHOD: give a download link to the prebuilt, already
#          tweaked 16 GiB root image -- CI trims it, it does NOT rebuild DMGs)
#   root_img_url  direct URL to a single plain ios16-root.img  <<< preferred/current
#                 (wins over root_img_tag when set)
#   root_img_tag  GitHub Release tag holding split parts (ios16-root.img.partNN)
#
#   -- or let CI build it from the IPSW DMGs --
#   size          root image size passed to mkiosroot.sh (default 16G)
#   dmgs_tag      GitHub Release tag holding split DMG parts (OS.dmg.part00 ...)
#   dmgs_base_url optional base URL where the three plain DMGs are hosted
#                  (no splitting needed); wins over dmgs_tag when set
#   archive_url   optional single .7z/.zip that contains the three DMGs
#   os_url / systemos_url / appos_url  optional three explicit direct URLs
#   local_dmgs_dir (self-hosted only) local dir holding the three DMGs
#
# Acquisition priority: root_img_url > root_img_tag > local_dmgs_dir >
#                       archive_url > os_url > dmgs_base_url > dmgs_tag
#
# When a prebuilt root image is supplied the DMG download and mkiosroot.sh are
# skipped entirely (~10 min saved) and CI goes straight to the trimmed build.
# This is also the SAFEST path: mkiosroot.sh alone does NOT run
# tools/sweet-root-tweaks.py, so a root rebuilt from the DMGs comes out with the
# 7 live _PanicOnCrash launchd jobs that panic the box on the first daemon crash
# (see NOTES-evergo.md v15). Supplying the image you already patched avoids that.
#
# The 16 GiB file exceeds GitHub's 2 GiB per-file cap, so it MUST be split into
# <2 GiB parts first (see tools/split_dmgs.sh). Outputs are likewise split before
# upload; reassemble locally with:
#   cat ios16-root.img.part*      > ios16-root.img
#   cat trimmed-root.img.part*    > trimmed-root.img

on:
  workflow_dispatch:
    inputs:
      root_img_url:
        description: "Optional: direct URL to a single plain ios16-root.img (16G)"
        default: ""
      root_img_tag:
        description: "Optional: Release tag holding split ios16-root.img.partNN parts"
        default: ""
      size:
        description: "Root image size (mkiosroot.sh SIZE argument)"
        default: "16G"
      dmgs_tag:
        description: "Release tag holding split DMG parts (OS.dmg.partNN etc.)"
        default: "dmgs"
      dmgs_base_url:
        description: "Optional base URL hosting plain OS.dmg/SystemOS.dmg/AppOS.dmg"
        default: ""
      local_dmgs_dir:
        description: "Self-hosted runners only: local dir with OS.dmg/SystemOS.dmg/AppOS.dmg (skips all uploads)"
        default: ""
      archive_url:
        description: "Optional: one .7z/.zip archive that contains OS.dmg/SystemOS.dmg/AppOS.dmg"
        default: ""
      os_url:
        description: "Optional: direct URL to OS.dmg (pair with systemos_url/appos_url)"
        default: ""
      systemos_url:
        description: "Optional: direct URL to SystemOS.dmg"
        default: ""
      appos_url:
        description: "Optional: direct URL to AppOS.dmg"
        default: ""
      no_dyld:
        description: "Drop the dyld shared cache from the trimmed QEMU RAM-disk root so it fits the ~2 GiB ml_io_map() ceiling. launchd cannot start, so only kernel-path (pre-dyld) panics reproduce."
        type: boolean
        default: false

concurrency:
  group: iosroot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19, which may
    # change apfs-fuse / hfsplus packages. Keep the verified 24.04 image.
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools + hfsprogs + build apfs-fuse
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          # NOTE: apfs-fuse is NOT an Ubuntu package; it is built from source
          # below. Never put it in the apt list or `apt-get install` fails
          # with "Unable to locate package apfs-fuse" (exit 100).
          sudo apt-get install -y --no-install-recommends \
            hfsprogs rsync fuse3 ca-certificates curl jq git \
            build-essential cmake libfuse3-dev libfuse-dev libattr1-dev \
            zlib1g-dev libbz2-dev libzstd-dev pkg-config p7zip-full unzip
          if ! command -v apfs-fuse >/dev/null 2>&1; then
            echo "building apfs-fuse from source (CMake)"
            git clone --depth 1 --recurse-submodules --shallow-submodules \
              https://github.com/sgan81/apfs-fuse /tmp/apfs-fuse
            cmake -S /tmp/apfs-fuse -B /tmp/apfs-fuse/build -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/apfs-fuse/build -j"$(nproc)"
            sudo install -m 755 /tmp/apfs-fuse/build/apfs-fuse /usr/local/bin/apfs-fuse
          fi
          sudo modprobe fuse 2>/dev/null || true
          echo "apfs-fuse : $(command -v apfs-fuse || echo MISSING)"
          echo "mkfs.hfsplus: $(command -v mkfs.hfsplus || echo MISSING)"
          echo "fsck.hfsplus: $(command -v fsck.hfsplus || echo MISSING)"
          df -h .

      # Fail fast (before downloading ~7.5 GB and building for ~10 min) if the
      # runner kernel cannot mount HFS+ or FUSE is unavailable. The GitHub
      # runner kernel ships hfsplus only in linux-modules-extra-<ver>.
      - name: Preflight (hfsplus module + FUSE device)
        run: |
          echo "kernel: $(uname -r)"
          echo "== /proc/filesystems (hfs) =="; grep -i hfs /proc/filesystems || echo "(none)"
          sudo modprobe hfsplus 2>/dev/null || true
          if ! grep -qw hfsplus /proc/filesystems; then
            echo "hfsplus missing -> installing linux-modules-extra-$(uname -r)"
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
            sudo modprobe hfsplus 2>/dev/null || true
          fi
          if ! grep -qw hfsplus /proc/filesystems; then
            echo "still missing -> trying linux-modules-extra-azure"
            sudo apt-get install -y linux-modules-extra-azure || true
            sudo modprobe hfsplus 2>/dev/null || true
          fi
          if ! grep -qw hfsplus /proc/filesystems; then
            echo "===== FATAL: kernel has NO hfsplus support (cannot populate HFS+) ====="
            uname -a
            echo "--- lsmod hfs ---"; lsmod | grep -i hfs || echo none
            echo "--- /lib/modules/$(uname -r)/kernel/fs ---"; ls "/lib/modules/$(uname -r)/kernel/fs" 2>/dev/null || echo none
            echo "--- apt policy ---"; apt-cache policy "linux-modules-extra-$(uname -r)" || true
            exit 1
          fi
          echo "hfsplus module OK"
          sudo modprobe fuse 2>/dev/null || true
          test -e /dev/fuse || { echo "===== FATAL: /dev/fuse missing (apfs-fuse cannot mount) ====="; ls -l /dev/fuse 2>&1 || true; exit 1; }
          echo "FUSE device OK"
          echo "apfs-fuse=$(command -v apfs-fuse) mkfs.hfsplus=$(command -v mkfs.hfsplus)"

      # ---------------------------------------------------------------------
      # CURRENT METHOD (user direction 2026-10-28): supply a download link to
      # the prebuilt, already-tweaked 16 GiB root image via `root_img_url`
      # (direct URL). CI then applies the current tools/sweet-root-tweaks.py
      # (idempotent) and trims it for the QEMU RAM-disk gate -- it does NOT
      # rebuild from the DMGs. The DMG-rebuild path below is only a fallback.
      # ---------------------------------------------------------------------
      - name: Acquire prebuilt root image
        id: acquire
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p in
          if [ -n "${{ inputs.root_img_url }}" ]; then
            echo "downloading prebuilt root image from ${{ inputs.root_img_url }}"
            curl -fL --retry 5 --retry-delay 5 -o ios16-root.img "${{ inputs.root_img_url }}"
          elif [ -n "${{ inputs.root_img_tag }}" ]; then
            echo "downloading prebuilt root image parts from release ${{ inputs.root_img_tag }}"
            gh release download "${{ inputs.root_img_tag }}" -D in --repo "${{ github.repository }}"
            if ls in/ios16-root.img.part* >/dev/null 2>&1; then
              echo "reassembling ios16-root.img from parts"
              cat in/ios16-root.img.part* > ios16-root.img
            fi
          fi
          sz=$(stat -c%s ios16-root.img 2>/dev/null || echo 0)
          echo "ios16-root.img size=$sz"
          if [ "$sz" -gt 1073741824 ]; then
            echo "have_root=true" >> "$GITHUB_OUTPUT"
            echo "using the prebuilt root image (skipping DMG download + mkiosroot.sh)"
          else
            rm -f ios16-root.img
            echo "have_root=false" >> "$GITHUB_OUTPUT"
            echo "no usable prebuilt root image -> building it from the DMGs"
          fi

      - name: Acquire DMGs
        if: steps.acquire.outputs.have_root != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dmgs
          if [ -n "${{ inputs.local_dmgs_dir }}" ]; then
            echo "self-hosted: copying DMGs from local dir ${{ inputs.local_dmgs_dir }}"
            for f in OS.dmg SystemOS.dmg AppOS.dmg; do
              cp -f "${{ inputs.local_dmgs_dir }}/$f" "dmgs/$f"
            done
          elif [ -n "${{ inputs.archive_url }}" ]; then
            echo "downloading single archive from ${{ inputs.archive_url }}"
            curl -fL --retry 5 --retry-delay 5 -o /tmp/ios_dmgs.pkg "${{ inputs.archive_url }}"
            rm -rf /tmp/x && mkdir -p /tmp/x
            7z x -y /tmp/ios_dmgs.pkg -o/tmp/x >/dev/null
            for f in OS.dmg SystemOS.dmg AppOS.dmg; do
              p=$(find /tmp/x -type f -name "$f" | head -n1)
              if [ -z "$p" ]; then echo "ERROR: $f not found inside the archive"; exit 1; fi
              cp -f "$p" "dmgs/$f"
            done
          elif [ -n "${{ inputs.os_url }}" ]; then
            echo "downloading three explicit URLs"
            curl -fL --retry 5 --retry-delay 5 -o dmgs/OS.dmg       "${{ inputs.os_url }}"
            curl -fL --retry 5 --retry-delay 5 -o dmgs/SystemOS.dmg "${{ inputs.systemos_url }}"
            curl -fL --retry 5 --retry-delay 5 -o dmgs/AppOS.dmg    "${{ inputs.appos_url }}"
          elif [ -n "${{ inputs.dmgs_base_url }}" ]; then
            for f in OS.dmg SystemOS.dmg AppOS.dmg; do
              curl -fL --retry 5 --retry-delay 5 -o "dmgs/$f" "${{ inputs.dmgs_base_url }}/$f"
            done
          else
            gh release download "${{ inputs.dmgs_tag }}" -D dmgs --repo "${{ github.repository }}"
            # Reassemble split parts: <name>.partNN -> <name>
            for base in OS.dmg SystemOS.dmg AppOS.dmg; do
              if ls dmgs/${base}.part* >/dev/null 2>&1; then
                echo "reassembling $base from parts"
                cat dmgs/${base}.part* > "dmgs/${base}"
                rm -f dmgs/${base}.part*
              fi
            done
          fi
          # Sanity: fail fast if any DMG is missing or truncated (expired link,
          # partial download, wrong archive contents, etc.)
          for pair in OS.dmg:4000000000 SystemOS.dmg:2000000000 AppOS.dmg:1000000; do
            f="${pair%%:*}"; min="${pair##*:}"
            sz=$(stat -c%s "dmgs/$f" 2>/dev/null || echo 0)
            echo "$f size=$sz (min $min)"
            if [ "$sz" -lt "$min" ]; then echo "ERROR: $f too small ($sz < $min) — link expired / download incomplete / wrong file"; exit 1; fi
          done
          ls -la dmgs

      - name: Build root image
        if: steps.acquire.outputs.have_root != 'true'
        run: |
          sudo bash tools/mkiosroot.sh \
            dmgs/OS.dmg dmgs/SystemOS.dmg dmgs/AppOS.dmg \
            ios16-root.img "${{ inputs.size }}"

      # ---------------------------------------------------------------------------
      # Trimmed, RAM-loadable root for QEMU (patch 0091e, rd=ufsroot0)
      #
      # The full 16 GiB image cannot be loaded into guest RAM on the test host
      # (only ~6 GiB free, and the dyld shared cache alone is 3.12 GiB).  This step
      # copies ONLY the files selected by the HakiOS trimming rules (see
      # tools/mk_trimmed_root_manifest.py) out of the full image into a fresh,
      # smaller HFS+ image, then applies the same launchd/container/audio/prefs
      # tweaks (tools/sweet-root-tweaks.py) the phone images get.  The result is
      # what qemu_check.py --root-img loads for the "test in QEMU before phone"
      # gate.  Needs the hfsplus module (ensured by Preflight) + loop mount.
      #
      # NOTE: the tweaks are applied by the trimmed build itself, so this is safe
      # even when the source ios16-root.img was rebuilt from the DMGs by
      # mkiosroot.sh (which does NOT run the tweaks).
      # ---------------------------------------------------------------------------
      # ---------------------------------------------------------------------
      # sweet-root-tweaks.py on the FULL root. mkiosroot.sh does not run it, and
      # without it the root keeps the 7 live _PanicOnCrash launchd jobs (any
      # daemon crashing once panics the box -- NOTES-evergo.md v15) and is
      # missing the containers, the Setup-skip (purplebuddy/migration) prefs,
      # the VirtualAudio disable and StartRecorderServer=false. Those all need
      # HFS+ catalog writes, which is why the local byte-level patch could only
      # do the _PanicOnCrash rename. Safe to re-run on an already tweaked image.
      # ---------------------------------------------------------------------
      - name: Apply sweet-root-tweaks.py to the full root
        run: |
          sudo mkdir -p /mnt/evergo_root
          sudo umount /mnt/evergo_root 2>/dev/null || true
          sudo mount -t hfsplus -oloop,rw,force ios16-root.img /mnt/evergo_root
          sudo python3 tools/sweet-root-tweaks.py /mnt/evergo_root
          sudo umount /mnt/evergo_root
          sudo fsck.hfsplus -fy ios16-root.img

      - name: Build trimmed root image (QEMU RAM-disk)
        run: |
          # --min-mib 0: the RAM-disk root must be as small as it can be; the
          # 4096 MiB floor would otherwise pin it at exactly 4 GiB.
          #
          # --no-dyld (when inputs.no_dyld): drop the 3.11 GiB dyld shared cache
          # so the trimmed root fits inside the ~2 GiB ml_io_map() ceiling
          # (patch 0091e) that the QEMU RAM-disk gate can actually map into
          # guest RAM. launchd cannot start without the dyld cache, so this only
          # reproduces spinlocks that fire BEFORE dyld/launchd (kernel root mount
          # + IOKit matching).
          ARGS="--min-mib 0"
          if [ "${{ inputs.no_dyld }}" = "true" ]; then ARGS="$ARGS --no-dyld"; fi
          sudo python3 tools/build_trimmed_root.py ios16-root.img trimmed-root.img $ARGS

      - name: Split trimmed output (artifact files are capped at 2 GiB)
        run: |
          mkdir -p trimmed_parts
          split -b 1900M -d trimmed-root.img trimmed_parts/trimmed-root.img.part
          ls -la trimmed_parts
          echo "Reassemble locally with: cat trimmed-root.img.part* > trimmed-root.img"

      - name: Upload trimmed parts
        uses: actions/upload-artifact@v4
        with:
          name: trimmed-root-img-parts
          path: trimmed_parts/*
          retention-days: 7

      - name: Split output (GitHub artifact files are capped at 2 GiB)
        run: |
          mkdir -p out_parts
          split -b 1900M -d ios16-root.img out_parts/ios16-root.img.part
          ls -la out_parts
          echo "Reassemble locally with: cat ios16-root.img.part* > ios16-root.img"

      - name: Upload output parts
        uses: actions/upload-artifact@v4
        with:
          name: ios16-root-img-parts
          path: out_parts/*
          retention-days: 7
