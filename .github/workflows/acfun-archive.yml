name: AcFun Web Archive Shard

# Run workflow inputs:
#   url         : direct link to CDX list (7z containing json, or json)
#   shard_count : how many shards the list is split into
#   shard_index : which shard this run handles (1-based)
#   shard_size  : entries per shard
#   per_pack    : web pages per 7z part
#   limit       : test mode, crawl only first N entries (0 = off)
#   delay       : request interval seconds (0 = unlimited)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "CDX list direct link (7z or json)"
        required: true
        default: ""
      shard_count:
        description: "total shards"
        required: false
        default: "93"
      shard_index:
        description: "shard index this run (1-based)"
        required: false
        default: "1"
      shard_size:
        description: "entries per shard"
        required: false
        default: "50000"
      per_pack:
        description: "web pages per 7z part"
        required: false
        default: "100000"
      limit:
        description: "test: crawl only first N entries (0 = off)"
        required: false
        default: "0"
      delay:
        description: "request interval seconds (0 = unlimited)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full >/dev/null
          pip install --quiet requests beautifulsoup4 lxml curl_cffi brotli zstandard
          7z | head -2 || true

      - name: Move workdir to big disk
        run: |
          sudo mkdir -p /mnt/acfun
          sudo chown -R $USER:$USER /mnt/acfun
          mkdir -p /mnt/acfun/work

      - name: Prepare input list (download, split shard)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          python3 tools/acfun/prepare_input.py \
            --url "${{ github.event.inputs.url }}" \
            --shard-count "${{ github.event.inputs.shard_count }}" \
            --shard-index "${{ github.event.inputs.shard_index }}" \
            --shard-size "${{ github.event.inputs.shard_size }}" \
            --limit "${{ github.event.inputs.limit }}" \
            --workdir /mnt/acfun/work

      - name: Crawl pages
        run: |
          set -e
          TAG=$(cat /mnt/acfun/work/shard_tag.txt)
          python3 tools/acfun/wayback_crawler.py \
            "/mnt/acfun/work/input/cdx_${TAG}.json" \
            -o /mnt/acfun/work/pages \
            -d "${{ github.event.inputs.delay }}" \
            --snapshot-field timestamp

      - name: Pack parts (LZMA 384m, 100k files each)
        run: |
          set -e
          TAG=$(cat /mnt/acfun/work/shard_tag.txt)
          python3 tools/acfun/pack_parts.py \
            --pages /mnt/acfun/work/pages \
            --parts /mnt/acfun/work/parts \
            --tag "$TAG" \
            --per-pack "${{ github.event.inputs.per_pack }}"

      - name: Final store-only 7z of all parts
        run: |
          set -e
          TAG=$(cat /mnt/acfun/work/shard_tag.txt)
          OUT="/mnt/acfun/work/${TAG}_all.7z"
          cd /mnt/acfun/work/parts
          7z a -t7z "$OUT" -y -mx=0 ./*.7z
          ls -la "$OUT"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=$(cat /mnt/acfun/work/shard_tag.txt)
          REPO="${GITHUB_REPOSITORY}"
          OUT="/mnt/acfun/work/${TAG}_all.7z"
          SIZE=$(stat -c%s "$OUT")
          echo "final size: $SIZE bytes"
          if [ "$SIZE" -gt 2000000000 ]; then
            echo ">2GB: splitting into 1.9G volumes"
            cd /mnt/acfun/work
            7z a -t7z -v1900m "${TAG}_all_vol.7z" -mx=0 "$OUT"
            gh release create "$TAG" -R "$REPO" --title "AcFun $TAG" --notes "shard package (volumes)" || true
            gh release upload "$TAG" ${TAG}_all_vol.7z.* -R "$REPO" --clobber
            echo "DOWNLOAD: https://github.com/$REPO/releases/tag/$TAG"
          else
            gh release create "$TAG" -R "$REPO" --title "AcFun $TAG" --notes "shard package" || true
            gh release upload "$TAG" "$OUT" -R "$REPO" --clobber
            echo "DOWNLOAD: https://github.com/$REPO/releases/download/$TAG/${TAG}_all.7z"
          fi

      - name: Summary
        run: |
          TAG=$(cat /mnt/acfun/work/shard_tag.txt)
          {
            echo "## Shard $TAG"
            echo "- pages: $(find /mnt/acfun/work/pages -type f ! -name '.*' | wc -l)"
            echo "- parts : $(ls /mnt/acfun/work/parts/*.7z 2>/dev/null | wc -l)"
            echo ""
            echo "download page: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Chain to next shard (auto)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 链式触发：本片成功 → 自动派发下一片，直到跑完 shard_count。
          # limit 模式（测试）不链式。输入 URL 存到 release 资产之外，
          # 直接透传本次的 url（分片共用同一输入）。
          LIMIT="${{ github.event.inputs.limit }}"
          if [ "${LIMIT:-0}" != "0" ]; then
            echo "test mode (limit=$LIMIT): no chaining"
            exit 0
          fi
          IDX=$((${{ github.event.inputs.shard_index }} + 1))
          COUNT=${{ github.event.inputs.shard_count }}
          if [ "$IDX" -gt "$COUNT" ]; then
            echo "ALL SHARDS DONE ($COUNT/$COUNT)"
            exit 0
          fi
          echo "dispatching shard $IDX/$COUNT ..."
          gh workflow run acfun-archive.yml -R "$GITHUB_REPOSITORY" --ref evergo \
            -f url='${{ github.event.inputs.url }}' \
            -f shard_count='$COUNT' \
            -f shard_index="$IDX" \
            -f shard_size='${{ github.event.inputs.shard_size }}' \
            -f per_pack='${{ github.event.inputs.per_pack }}' \
            -f limit='0' \
            -f delay='${{ github.event.inputs.delay }}'
